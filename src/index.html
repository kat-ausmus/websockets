<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Websocket Live Test Rig</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 20px;
                background-color: #121212;
                color: #fff;
            }
            #log {
                background: #000;
                padding: 10px;
                height: 300px;
                overflow-y: scroll;
                border: 1px solid #333;
            }
            .status-on {color: green;}
            .status-off {color: red;}
            .deployMessage {
                background-color: lightgray;
                border-radius: 8px;
                border: 1px solid #ccc;
                padding: 5px 15px;
                cursor: pointer;
                color: #000;
                margin-left: 10px;
            }
            .messageInput {
                border-radius: 8px;
                border: 1px solid #333;
                padding: 5px 10px;
                background-color: #222;
                color: #fff;
            }
            .messageInput::placeholder {
                color: yellowgreen;
            }
        </style>
    </head>
<body>
    <h1>Websocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting...</p>
    <form id="message-form">
        <label for="message-input"></label><input class="messageInput" type="text" id="message-input" placeholder="Type message..." required>
        <button class='deployMessage' type="submit">Deploy Message</button>
    </form>
    <h3> Live Stream Logs:</h3>
    <pre id="log"></pre>
</body>

<script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const messageInput = document.getElementById('message-input');

    // 1. Initialize WebSocket connection
    const socket = new WebSocket('ws://' + window.location.host);

    const appendLog = (label, message) => {
        const entry = `${new Date().toLocaleTimeString()}: ${label}, ${message}\n`;
        logEl.textContent = entry + logEl.textContent;
    }

    // we're using addEventListener instead of onopen, or onclose,
    // because the `on` only creates one event listener for each event type.
    // we want to use addEventListener so multiple things can hook into these event types
    // (multiple independent reaction to the same events)

    // 2. Add event listener for message
    socket.addEventListener('open', () => {
        statusEl.textContent = 'CONNECTED: ' + socket.url;
        statusEl.className = 'status-on';
        appendLog('[SYSTEM]', 'Tunnel Established');
    });

    // 3. Add event listener for close
    socket.addEventListener('close', () => {
        statusEl.textContent = 'DISCONNECTED';
        statusEl.className = 'status-off';
        appendLog('[SYSTEM]', 'Tunnel Closed');
    });

    socket.addEventListener('message', (e) => {
        appendLog('[RECEIVED]', e.data);
    });

    document.getElementById('message-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const message = messageInput.value.trim();
        if(socket.readyState === WebSocket.OPEN) {
            socket.send(message);
            appendLog('[SENT]', message);
            messageInput.value = '';
        } else {
            appendLog('[ERROR]', 'No Active Tunnel');
        }
    })

</script>
</html>
